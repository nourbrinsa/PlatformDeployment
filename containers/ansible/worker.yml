---
- name: Deploy worker agent code
  hosts: workers
  become: true

  vars:
    project_dir: /opt/projet-iac

  tasks:
    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Copy containers folder to target host
      copy:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_dir }}/containers"
        mode: preserve

    - name: Install Python and pip
      apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present

    - name: Install Flask in a virtual environment
      pip:
        name: 
          - flask
          - requests
        virtualenv: "{{ project_dir }}/containers/agent/venv"
        virtualenv_command: python3 -m venv

    - name: Pre-build ubuntu SSH image
      command: >
        docker build --build-arg BASE_IMAGE=ubuntu:24.04
        -t ssh-ubuntu {{ project_dir }}/containers/docker
      changed_when: true
      environment:
        DOCKER_BUILDKIT: "1"

    - name: Pre-build debian SSH image
      command: >
        docker build --build-arg BASE_IMAGE=debian:12
        -t ssh-debian {{ project_dir }}/containers/docker
      changed_when: true
      environment:
        DOCKER_BUILDKIT: "1"

    - name: Install worker agent systemd service
      template:
        src: worker-agent.service.j2
        dest: /etc/systemd/system/worker-agent.service
        mode: "0644"
      notify: Reload and restart worker agent

  handlers:
    - name: Reload and restart worker agent
      systemd:
        daemon_reload: true
        name: worker-agent
        state: restarted
        enabled: true
