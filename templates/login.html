{% extends "base.html" %}

{% block title %}
Connexion
{% endblock %}


{% block content %}

<div class="login">

    <h1>Connexion</h1>

    <p>
        Connectez-vous à votre espace de gestion.
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <label>
            Nom d'utilisateur
        </label>

        <input
            type="text"
            name="username"
            placeholder="Nom d'utilisateur"
            required
        >


        <label>
            Mot de passe
        </label>

        <input
            type="password"
            name="password"
            placeholder="Mot de passe"
            required
        >


        <button
            type="submit"
            class="button"
        >
            Se connecter
        </button>

    </form>


    <p class="login-link">

        Vous n'avez pas encore de compte ?

        <a href="{{ url_for('register') }}">
            Créer un compte
        </a>

    </p>

</div>

{% endblock %}
