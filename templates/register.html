{% extends "base.html" %}

{% block title %}
Créer un compte
{% endblock %}


{% block content %}

<div class="login">

    <h1>Créer un compte</h1>

    <p>
        Créez votre compte IaC Rental.
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <label>
            Nom d'utilisateur
        </label>

        <input
            type="text"
            name="username"
            placeholder="Nom d'utilisateur"
            required
        >


        <label>
            Adresse e-mail
        </label>

        <input
            type="email"
            name="email"
            placeholder="exemple@email.com"
            required
        >


        <label>
            Mot de passe
        </label>

        <input
            type="password"
            name="password"
            placeholder="Mot de passe"
            required
        >


        <label>
            Confirmer le mot de passe
        </label>

        <input
            type="password"
            name="password_confirm"
            placeholder="Confirmer le mot de passe"
            required
        >


        <button
            type="submit"
            class="button"
        >
            Créer mon compte
        </button>

    </form>


    <p class="login-link">

        Vous avez déjà un compte ?

        <a href="{{ url_for('login') }}">
            Se connecter
        </a>

    </p>

</div>

{% endblock %}
