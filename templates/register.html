{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div style="max-width:420px;margin:3rem auto">
  <div class="card">
    <h2 style="margin-bottom:1.2rem">Créer un compte</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" required autofocus>
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Mot de passe</label>
      <input type="password" name="password" required>
      <button class="btn btn-primary" style="width:100%">S'inscrire</button>
    </form>
    <p style="margin-top:1rem;font-size:.9rem">Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a></p>
  </div>
</div>
{% endblock %}
